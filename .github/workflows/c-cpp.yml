name: C++ Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configure project
        run: cmake -S cpp-screen-build-team-lab -B cpp-screen-build-team-lab/build

      - name: Build project
        run: cmake --build cpp-screen-build-team-lab/build --parallel

      - name: Run tests
        run: ctest --test-dir cpp-screen-build-team-lab/build --output-on-failure
